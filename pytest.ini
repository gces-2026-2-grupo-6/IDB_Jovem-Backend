[pytest]
pythonpath = .
testpaths = tests
# Piso de 97% com a cobertura real em 99%: PR que derruba a cobertura falha.
addopts = --cov --cov-fail-under=97 --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov -m "not endpoint"
markers =
    endpoint: testes que apontam para o container real via HTTP
